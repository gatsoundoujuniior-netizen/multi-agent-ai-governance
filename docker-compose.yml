# PostgreSQL pour les donnees du projet (separe de la base interne d'OpenMetadata).
# OpenMetadata se lance a part : voir openmetadata/docker-compose.yml
services:
  postgres:
    image: postgres:16
    container_name: gouv_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"   # 5433 cote Windows, pour ne rien cogner
    volumes:
      - pgdata:/var/lib/postgresql/data
      # sql/init s'execute une seule fois, au tout premier demarrage (base vide)
      - ./sql/init:/docker-entrypoint-initdb.d
      # Les autres scripts se lancent a la main : psql -f /sql/<fichier>.sql
      - ./sql:/sql:ro
      # Petites tables simulees, lues par COPY ... FROM '/seed/<fichier>.csv'
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
